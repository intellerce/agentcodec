# Library deployment config — FIXED strategy: diversity_mrc.
# -----------------------------------------------------------
# Two channels from different model families answer in parallel; the judge
# produces a quality-weighted blend (Maximal Ratio Combining). Strongest
# default when you have two uncorrelated models available.

models:
  - model: "qwen2.5:7b"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    temperature: 0.7
    cost_per_1m: { input: 0.10, output: 0.10 }

  - model: "llama3.1:8b"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    temperature: 0.7
    cost_per_1m: { input: 0.10, output: 0.10 }

judge:
  model: "gemma3:12b"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  cost_per_1m: { input: 0.15, output: 0.15 }

strategy:
  type: "fixed"
  technique: "diversity_mrc"

defaults:
  category: "auto"
  on_error: "fallback_baseline"
  task_timeout_s: 300
