name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install with the dev + openai + eval extras. We don't need
      # anthropic/ollama/torch in CI — the smoke tests use MockChannel.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,openai,eval]'

      - name: Lint
        run: ruff check agentcodec/ tests/

      - name: Type-check
        run: mypy agentcodec/ || true   # informational until we close the gaps

      - name: Tests
        run: pytest tests/ -q --tb=short

      - name: Verify every configs/lib/*.yaml loads
        run: |
          python - <<'PY'
          from pathlib import Path
          from agentcodec.config import LibraryConfig
          errors = []
          for p in Path("configs/lib").glob("*.yaml"):
              try:
                  LibraryConfig.from_yaml(p)
                  print(f"  ok  {p}")
              except Exception as e:
                  errors.append((p, e))
                  print(f"  FAIL {p}: {e!r}")
          if errors:
              raise SystemExit(f"{len(errors)} config(s) failed to load")
          PY
